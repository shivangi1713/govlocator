<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GovLocator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>GovLocator</h1>

  <div id="controls">
    <input id="search-input" type="text" placeholder="Enter a location, e.g. Mumbai">
    <select id="service-type">
      <option value="hospital">Health Center / PHC</option>
      <option value="school">School / College</option>
      <option value="police">Police Station</option>
      <option value="fire_station">Fire Station</option>
      <option value="store">Ration Shop / PDS</option>
    </select>
    <button id="search-btn">🔍 Search</button>
  </div>

  <div id="map"></div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBODz-0az8HHDHPAFIBKZekOQSHwBbeOvk&libraries=places"></script>
  <script src="js/app.js"></script>
</body>
</html>
